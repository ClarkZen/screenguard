# ScreenGuard — Postgres stack
# ─────────────────────────────
# Pulls the latest server release from GitHub and wires it to a Postgres container.
# Use this to test or run the Postgres path locally.
#
# Quickstart:
#   docker compose -f docker-compose.postgres.yml up --build
#   Open http://localhost:5000 and create an admin account.
#
# NOTE: mDNS auto-discovery does not work in bridge mode.
# Agents on the LAN must point at the host IP explicitly:
#   server_url = "ws://<host-ip>:8080"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER} -d $${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
      args:
        VERSION: v0.10.0 # pinned version for Portainer deployment, otherwise use latest
    image: screenguard-server-dev
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}
      SCREENGUARD_SERVER_JWT_SECRET: ${SG_SERVER_SECRET} # edit ENV file
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webui:
    build:
      context: ./webui
      dockerfile: ../deploy/Dockerfile.webui
    image: screenguard-webui
    ports:
      - "5000:5000"
    environment:
      SERVER_URL: http://server:8080
      SECRET_KEY: ${SG_WEBUI_SECRET} # edit ENV file
      UI_PORT: "5000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg-data:
